[project]
name = "ai-sre-agent"
version = "0.1.0"
description = "Read-only agent that investigates Kubernetes incidents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "kubernetes-asyncio>=36.1.0",
    "mcp>=2.3.0",
    "openai>=2",
    "pydantic>=2.14.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ai-sre-mcp = "ai_sre_agent.mcp_server.server:main"
ai-sre-agent = "ai_sre_agent.service:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_sre_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs the kind stand from voting-infra-local"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
